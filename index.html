<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <!-- ========================================================================= -->
    <!-- 🔴 GOOGLE E-TABLO VERİ KÖPRÜSÜ (GÖMÜLÜ) -->
    <!-- ========================================================================= -->
    <script>
        const GOOGLE_TABLO_CSV_LINKI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHR18JHvCFYZF1yWinW1iilYM4kngTgFqb8enAuEf_PBwFflPGxwT2scB54fnFxfg3OgVcQC8HB9LS/pub?output=csv";
    </script>
    <!-- ========================================================================= -->

    <!-- YAKINLAŞMAYI KESİN ENGELLEYEN META -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARSLANOĞLU GROUP - Mobil Not Sistemi</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arslanoğlu Not">
    <meta name="theme-color" content="#121212">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation !important; /* ÇİFT DOKUNMA ZOOM'UNU KİLİTLER */
        }

        html, body {
            height: 100%;
            height: 100dvh; /* DİNAMİK VİEWPORT */
            background-color: #121212;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 1. GİRİŞ EKRANI */
        #loginScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #121212;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 25px;
        }

        .login-box {
            text-align: center;
            width: 100%;
            max-width: 330px;
            margin: 0 auto;
        }

        .login-logo { font-size: 50px; margin-bottom: 8px; }
        .login-title { color: #d4af37; font-size: 19px; font-weight: 900; letter-spacing: 2px; margin-bottom: 4px; }
        .login-subtitle { color: #888; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 20px; }

        .login-input {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #333;
            color: #f1c40f;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px !important; /* İPHONE ZOOM ENGELİ */
            margin-bottom: 12px;
            outline: none;
            user-select: text;
        }
        .login-input:focus { border-color: #d4af37; }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #121212;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 6px;
        }

        .login-status {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 12px;
            font-weight: bold;
            min-height: 18px;
        }

        .btn-bypass {
            background: transparent;
            color: #777;
            border: none;
            font-size: 11px;
            margin-top: 16px;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 2. NOT GİRİŞ MASASI */
        .header {
            background: linear-gradient(135deg, #1e1e1e 0%, #0d0d0d 100%);
            border-bottom: 1px solid #2a2a2a;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 48px;
        }

        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-logo { font-size: 20px; }
        .brand-title { font-size: 12px; font-weight: 900; color: #d4af37; letter-spacing: 1px; }

        .course-tag {
            background: #2a2a2e;
            border: 1px solid #d4af37;
            color: #f1c40f;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .header-actions { display: flex; gap: 4px; }
        .btn-header {
            background: #26262a;
            color: #d4af37;
            border: 1px solid #444;
            padding: 5px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-download { background: #0969da; color: #fff; border: none; font-weight: 900; }
        .btn-list { background: #238636; color: #fff; border: none; }
        .btn-sync { background: #d4af37; color: #121212; border: none; font-weight: 900; }
        .btn-logout { background: #c0392b; color: #fff; border: none; }

        .progress-bar-container { height: 3px; background-color: #222; width: 100%; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #d4af37, #2ea043); width: 0%; transition: width 0.3s ease; }

        .search-container { padding: 6px 12px 2px 12px; }
        .search-input {
            width: 100%;
            background: #1c1c1e;
            border: 1px solid #333;
            color: #f1c40f;
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 16px !important; /* İPHONE ZOOM ENGELİ */
            outline: none;
            user-select: text;
        }
        .search-input:focus { border-color: #d4af37; }

        .student-section { padding: 4px 12px 2px 12px; display: flex; flex-direction: column; gap: 2px; }
        .student-counter { font-size: 10px; color: #888; font-weight: 600; display: flex; justify-content: space-between; }
        
        .student-card { 
            background: #1c1c1e; 
            border: 1px solid #2c2c2e; 
            border-radius: 10px; 
            padding: 8px 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .student-info .no { font-size: 11px; color: #d4af37; font-weight: bold; }
        .student-info .name { font-size: 14px; color: #fff; font-weight: 700; }
        .student-total { text-align: right; }
        .student-total .score { font-size: 22px; font-weight: 900; color: #2ea043; }
        .student-total .label { font-size: 8px; color: #777; text-transform: uppercase; }

        .questions-scroll { display: flex; gap: 6px; padding: 4px 12px; overflow-x: auto; scrollbar-width: none; }
        .questions-scroll::-webkit-scrollbar { display: none; }

        .q-pill { background: #252528; border: 1px solid #333; border-radius: 8px; min-width: 52px; padding: 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .q-pill.active { background: #d4af37; border-color: #f1c40f; transform: scale(1.04); }
        .q-pill.active .q-title, .q-pill.active .q-val, .q-pill.active .q-max { color: #121212 !important; }
        .q-pill .q-title { font-size: 10px; color: #aaa; font-weight: 600; }
        .q-pill .q-val { font-size: 13.5px; font-weight: 800; color: #fff; margin: 1px 0; }
        .q-pill .q-max { font-size: 8px; color: #666; }

        .active-question-display { text-align: center; padding: 1px 0; }
        .active-question-display .title { font-size: 11px; color: #bbb; }
        .active-question-display .val-preview { font-size: 28px; font-weight: 900; color: #d4af37; }

        /* TUŞ TAKIMI (KORUMALI ALT BOŞLUK) */
        .keypad-container { 
            margin-top: auto; 
            background: #18181a; 
            border-top: 1px solid #282828; 
            padding: 6px 8px calc(24px + env(safe-area-inset-bottom)) 8px;
        }
        .nav-controls { display: flex; gap: 6px; margin-bottom: 5px; }
        .nav-btn { flex: 1; background: #2a2a2e; color: #fff; border: none; padding: 7px; border-radius: 7px; font-size: 11px; font-weight: bold; cursor: pointer; }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .key { 
            background: #26262a; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            height: 42px;
            font-size: 20px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
        }
        .key:active { background: #d4af37; color: #121212; }
        .key.btn-action { background: #34343a; font-size: 15px; }
        .key.btn-enter { background: #238636; color: #fff; font-size: 12px; font-weight: 800; }

        /* MODALLAR */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); padding: 18px; z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: #1c1c1e; border: 1px solid #333; border-radius: 14px; padding: 16px; width: 100%; max-width: 360px; max-height: 85dvh; display: flex; flex-direction: column; }
        .modal-content h3 { color: #d4af37; margin-bottom: 8px; font-size: 16px; text-align: center; }
        
        .student-list-scroll { overflow-y: auto; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; padding-right: 3px; }
        .student-item { background: #252528; border: 1px solid #333; border-radius: 7px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        
        /* NOTU GİRİLMİŞ ÖĞRENCİ (YEŞİL ROZET & ÇERÇEVE) */
        .student-item.graded { background: #143522; border: 1px solid #2ea043; }
        .student-item.graded .st-name { color: #2ea043; font-weight: bold; }
        .student-item.graded .st-badge { background: #2ea043; color: #121212; font-weight: 900; }
        
        .student-item .st-no { font-size: 10px; color: #aaa; }
        .student-item .st-name { font-size: 13px; color: #fff; }
        .student-item .st-badge { background: #333; color: #bbb; font-size: 10.5px; padding: 2px 7px; border-radius: 10px; font-weight: bold; }

        .modal-btn { width: 100%; background: #d4af37; color: #121212; border: none; padding: 11px; border-radius: 8px; font-weight: 900; font-size: 12.5px; cursor: pointer; margin-top: 6px; }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="loginScreen">
        <div class="login-box">
            <div class="login-logo">🦁</div>
            <div class="login-title">ARSLANOĞLU GROUP</div>
            <div class="login-subtitle">MOBİL ÖĞRETMEN GİRİŞİ</div>

            <input type="text" id="loginUser" class="login-input" placeholder="Kullanıcı Adı..." autocapitalize="none">
            <input type="password" id="loginPass" class="login-input" placeholder="Şifre...">

            <button class="login-btn" id="btnSubmit" onclick="handleLogin()">GİRİŞ YAP ➔</button>
            <div id="loginStatus" class="login-status"></div>

            <button class="btn-bypass" onclick="loginSuccess('Yönetici')">⚡ Şifresiz Doğrudan Not Girişine Geç</button>
        </div>
    </div>

    <!-- 2. NOT GİRİŞ MASASI -->
    <div class="header">
        <div class="brand">
            <div class="brand-logo">🦁</div>
            <div>
                <div class="brand-title" id="teacherBadge">ÖĞRETMEN</div>
                <div class="course-tag" onclick="openCourseModal()" id="courseBadge">📐 Matematik (9-A) ▾</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-header btn-download" onclick="fetchSetupFromDesktop()">📥 İndir</button>
            <button class="btn-header btn-list" onclick="openStudentListModal()">📋 Liste</button>
            <button class="btn-header btn-sync" onclick="syncDirectToCloud()">☁️ Bulut</button>
            <button class="btn-header btn-logout" onclick="handleLogout()">Çıkış</button>
        </div>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- HIZLI ARAMA ÇUBUĞU (OKUL NO VEYA İSİM İLE ANINDA BULUR) -->
    <div class="search-container">
        <input type="search" id="quickSearchInput" class="search-input" placeholder="🔍 Okul No veya İsim ile Hızlı Bul..." oninput="handleQuickSearch(this.value)">
    </div>

    <!-- ÖĞRENCİ KARTI -->
    <div class="student-section">
        <div class="student-counter">
            <span id="studentIndexLabel">Öğrenci: 1 / 5</span>
            <span id="percentCompleted">%0 Tamamlandı</span>
        </div>
        <div class="student-card">
            <div class="student-info">
                <div class="no" id="studentNo">No: 101</div>
                <div class="name" id="studentName">Ali Yılmaz</div>
            </div>
            <div class="student-total">
                <div class="score" id="studentTotalScore">0</div>
                <div class="label">Toplam Puan</div>
            </div>
        </div>
    </div>

    <div class="questions-scroll" id="questionsContainer"></div>

    <div class="active-question-display">
        <div class="title" id="activeQTitle">1. Soru Puanı (Maks: 10)</div>
        <div class="val-preview" id="activeQValue">-</div>
    </div>

    <!-- TUŞ TAKIMI (KORUMALI ALT PAYLI) -->
    <div class="keypad-container">
        <div class="nav-controls">
            <button class="nav-btn" onclick="prevStudent()">⬅ Önceki</button>
            <button class="nav-btn" onclick="nextStudent()">Sonraki ➔</button>
        </div>
        <div class="keypad-grid">
            <button class="key" onclick="pressNum('1')">1</button>
            <button class="key" onclick="pressNum('2')">2</button>
            <button class="key" onclick="pressNum('3')">3</button>
            <button class="key" onclick="pressNum('4')">4</button>
            <button class="key" onclick="pressNum('5')">5</button>
            <button class="key" onclick="pressNum('6')">6</button>
            <button class="key" onclick="pressNum('7')">7</button>
            <button class="key" onclick="pressNum('8')">8</button>
            <button class="key" onclick="pressNum('9')">9</button>
            <button class="key btn-action" onclick="clearScore()">C</button>
            <button class="key" onclick="pressNum('0')">0</button>
            <button class="key btn-enter" onclick="confirmAndNext()">GEÇ ➔</button>
        </div>
    </div>

    <!-- DERS & ŞUBE SEÇİM MODAL -->
    <div class="modal" id="courseModal">
        <div class="modal-content">
            <h3>📐 Şube & Ders Seçimi</h3>
            <p style="font-size:11px; color:#aaa; margin-bottom:12px; text-align:center;">Hangi sınıfın notlarını okuyorsanız seçiniz:</p>
            
            <label style="font-size:11px; color:#d4af37; font-weight:bold;">Ders:</label>
            <input type="text" id="inpCourseName" class="login-input" style="padding:9px; margin-bottom:8px;" value="Matematik">
            
            <label style="font-size:11px; color:#d4af37; font-weight:bold;">Şube (Örn: 9-A, 9-B):</label>
            <input type="text" id="inpBranchName" class="login-input" style="padding:9px; margin-bottom:12px;" value="9-A">

            <button class="modal-btn" onclick="saveCourseSettings()">Seçimi Uygula</button>
            <button class="modal-btn" style="background:#333; color:#fff;" onclick="closeCourseModal()">Kapat</button>
        </div>
    </div>

    <!-- SINIF LİSTESİ MODAL (YEŞİL GÖSTERGELİ) -->
    <div class="modal" id="studentListModal">
        <div class="modal-content">
            <h3>📋 Şube Öğrenci Listesi</h3>
            <div style="font-size:10.5px; color:#aaa; text-align:center; margin-bottom:6px;">
                <span style="color:#2ea043; font-weight:bold;">✔ Yeşil:</span> Notu Girilenler | 
                <span style="color:#888;">⏳ Gri:</span> Bekleyenler
            </div>
            <input type="search" id="modalSearchInput" class="search-input" placeholder="🔍 Listede filtrele..." oninput="renderStudentListModal(this.value)">
            <div class="student-list-scroll" id="modalStudentListContainer"></div>
            <button class="modal-btn" style="background:#333; color:#fff;" onclick="closeStudentListModal()">Kapat</button>
        </div>
    </div>

    <script>
        // Çift dokunma zoom kilidi
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) event.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('gesturestart', (e) => e.preventDefault());

        let currentActiveUser = "arslanoglu";
        let currentCourse = "Matematik";
        let currentBranch = "9-A";
        let currentExam = "1. Dönem 1. Ortak Yazılı";

        async function handleLogin() {
            const user = document.getElementById("loginUser").value.trim();
            const pass = document.getElementById("loginPass").value.trim();
            const statusEl = document.getElementById("loginStatus");
            const btnEl = document.getElementById("btnSubmit");

            if (!user || !pass) { statusEl.innerText = "Kullanıcı adı ve şifre yazınız!"; return; }

            statusEl.style.color = "#f1c40f";
            statusEl.innerText = "Doğrulanıyor... ⏳";
            btnEl.disabled = true;

            if (user.toLowerCase() === "arslanoglu" && pass === "123456") {
                loginSuccess("Yönetici", "arslanoglu");
                return;
            }

            try {
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(GOOGLE_TABLO_CSV_LINKI);
                const response = await fetch(proxyUrl, { cache: "no-store" });
                if (!response.ok) throw new Error();
                
                const csvData = await response.text();
                const lines = csvData.trim().split("\n");
                const headers = lines[0].split(",").map(h => h.trim().toLowerCase().replace(/"/g, "").replace(/\r/g, ""));

                let onay = false;
                let ogretmenAdi = user;

                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i].split(",").map(c => c.trim().replace(/"/g, "").replace(/\r/g, ""));
                    let rowData = {};
                    headers.forEach((h, idx) => rowData[h] = row[idx]);

                    if ((rowData["kullanici_adi"] || "").toLowerCase() === user.toLowerCase() && rowData["sifre"] === pass) {
                        if ((rowData["durum"] || "Aktif").toLowerCase() === "aktif") {
                            onay = true;
                            ogretmenAdi = rowData["ad_soyad"] || user;
                            break;
                        } else {
                            statusEl.innerText = "Üyeliğiniz pasif durumdadır!";
                            btnEl.disabled = false;
                            return;
                        }
                    }
                }

                if (onay) {
                    loginSuccess(ogretmenAdi, user);
                } else {
                    statusEl.innerText = "Kullanıcı adı veya şifre hatalı!";
                    btnEl.disabled = false;
                }
            } catch (err) {
                statusEl.innerHTML = "Google E-Tabloya bağlanılamadı.<br>Alttaki 'Şifresiz Geç' butonunu kullanabilirsiniz.";
                btnEl.disabled = false;
            }
        }

        function loginSuccess(teacherName, rawUsername = "arslanoglu") {
            currentActiveUser = rawUsername.toLowerCase().replace(/[^a-z0-9]/g, "");
            localStorage.setItem("arslanoglu_user_session", teacherName);
            localStorage.setItem("arslanoglu_raw_user", currentActiveUser);
            document.getElementById("teacherBadge").innerText = teacherName.toUpperCase();
            document.getElementById("loginScreen").style.display = "none";
            loadCourseData();
            fetchSetupFromDesktop(true); // Açılışta masaüstünden yeni kurulum var mı kontrol et
            renderUI();
        }

        function handleLogout() {
            if (confirm("Oturumu kapatmak istediğinize emin misiniz?")) {
                localStorage.removeItem("arslanoglu_user_session");
                localStorage.removeItem("arslanoglu_raw_user");
                document.getElementById("loginUser").value = "";
                document.getElementById("loginPass").value = "";
                document.getElementById("loginStatus").innerText = "";
                document.getElementById("btnSubmit").disabled = false;
                document.getElementById("loginScreen").style.display = "flex";
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const savedSession = localStorage.getItem("arslanoglu_user_session");
            const savedRawUser = localStorage.getItem("arslanoglu_raw_user");
            if (savedSession) loginSuccess(savedSession, savedRawUser || "arslanoglu");
        });

        // 🔴 MASAÜSTÜNDEN GERÇEK SINIFLARI VE SORULARI İNDİRME KÖPRÜSÜ
        async function fetchSetupFromDesktop(silent = false) {
            const topic = "arslanoglu_setup_" + currentActiveUser;
            try {
                const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1`, { cache: "no-store" });
                if (!res.ok) return;
                const txt = await res.text();
                const lines = txt.trim().split("\n");
                if (lines.length === 0 || lines[0] === "") return;

                const lastMsg = JSON.parse(lines[lines.length - 1]);
                const setupData = JSON.parse(lastMsg.message);

                if (setupData.type === "setup" && setupData.subeler) {
                    currentCourse = setupData.ders || "Matematik";
                    currentExam = setupData.sinav || "1. Ortak Yazılı";
                    
                    const subeler = Object.keys(setupData.subeler);
                    currentBranch = subeler[0] || "9-A";

                    examConfig = {
                        ders: currentCourse,
                        sube: currentBranch,
                        sinav: currentExam,
                        questions: setupData.questions || [{ no: 1, max: 10 }, { no: 2, max: 10 }],
                        students: (setupData.subeler[currentBranch] || []).map(st => ({
                            no: st.no,
                            name: st.ad_soyad || st.name,
                            scores: Array((setupData.questions || []).length).fill(0)
                        }))
                    };

                    saveToStorage();
                    renderUI();

                    if (!silent) {
                        alert(`🎉 BİLGİSAYARDAN YENİ SINAV KURULUMU ALINDI!\n\n📚 Ders: ${currentCourse}\n🏫 Şube: ${currentBranch}\n👥 Öğrenci Sayısı: ${examConfig.students.length}\n\nÖğrenci listesi başarıyla güncellendi!`);
                    }
                }
            } catch(e) {
                if (!silent) alert("Masaüstünden henüz gönderilmiş bir sınav kurulumu bulunamadı.");
            }
        }

        function openCourseModal() {
            document.getElementById("inpCourseName").value = currentCourse;
            document.getElementById("inpBranchName").value = currentBranch;
            document.getElementById("courseModal").style.display = "flex";
        }

        function closeCourseModal() {
            document.getElementById("courseModal").style.display = "none";
        }

        function saveCourseSettings() {
            currentCourse = document.getElementById("inpCourseName").value.trim() || "Matematik";
            currentBranch = document.getElementById("inpBranchName").value.trim().toUpperCase() || "9-A";
            closeCourseModal();
            loadCourseData();
            renderUI();
        }

        function getStorageKey() {
            return `ars_exam_${currentCourse.toLowerCase()}_${currentBranch.toLowerCase()}`;
        }

        let examConfig = {};

        function loadCourseData() {
            const key = getStorageKey();
            const saved = localStorage.getItem(key);
            if (saved) {
                try { examConfig = JSON.parse(saved); return; } catch(e) {}
            }

            examConfig = {
                ders: currentCourse,
                sube: currentBranch,
                sinav: currentExam,
                questions: [
                    { no: 1, max: 10 }, { no: 2, max: 10 }, { no: 3, max: 15 },
                    { no: 4, max: 15 }, { no: 5, max: 10 }, { no: 6, max: 10 },
                    { no: 7, max: 15 }, { no: 8, max: 15 }
                ],
                students: [
                    { no: "101", name: "Ali Yılmaz", scores: [0,0,0,0,0,0,0,0] },
                    { no: "102", name: "Ayşe Kaya", scores: [0,0,0,0,0,0,0,0] },
                    { no: "103", name: "Mehmet Demir", scores: [0,0,0,0,0,0,0,0] },
                    { no: "104", name: "Zeynep Çelik", scores: [0,0,0,0,0,0,0,0] },
                    { no: "105", name: "Burak Şahin", scores: [0,0,0,0,0,0,0,0] }
                ]
            };
            saveToStorage();
        }

        let currentStudentIdx = 0;
        let currentQuestionIdx = 0;
        let inputBuffer = "";

        function saveToStorage() {
            examConfig.ders = currentCourse;
            examConfig.sube = currentBranch;
            localStorage.setItem(getStorageKey(), JSON.stringify(examConfig));
        }

        function isStudentGraded(student) {
            return student.scores.some(sc => sc > 0);
        }

        function renderUI() {
            if (!examConfig.students || examConfig.students.length === 0) return;
            const student = examConfig.students[currentStudentIdx];

            document.getElementById("courseBadge").innerText = `📐 ${currentCourse} (${currentBranch}) ▾`;

            document.getElementById("studentNo").innerText = "No: " + student.no;
            document.getElementById("studentName").innerText = student.name;
            document.getElementById("studentIndexLabel").innerText = `Öğrenci: ${currentStudentIdx + 1} / ${examConfig.students.length}`;

            // Soru Hapları
            const qContainer = document.getElementById("questionsContainer");
            qContainer.innerHTML = "";
            examConfig.questions.forEach((q, idx) => {
                const pill = document.createElement("div");
                pill.className = `q-pill ${idx === currentQuestionIdx ? 'active' : ''}`;
                pill.onclick = () => selectQuestion(idx);
                pill.innerHTML = `
                    <div class="q-title">S${q.no}</div>
                    <div class="q-val">${student.scores[idx] !== undefined ? student.scores[idx] : 0}</div>
                    <div class="q-max">/${q.max}p</div>
                `;
                qContainer.appendChild(pill);
            });

            const total = student.scores.reduce((a, b) => a + b, 0);
            document.getElementById("studentTotalScore").innerText = total;

            const activeQ = examConfig.questions[currentQuestionIdx];
            document.getElementById("activeQTitle").innerText = `${activeQ.no}. Soru Puanı (Maks: ${activeQ.max}p)`;
            document.getElementById("activeQValue").innerText = inputBuffer !== "" ? inputBuffer : student.scores[currentQuestionIdx];

            const totalGraded = examConfig.students.filter(s => isStudentGraded(s)).length;
            const pct = Math.round((totalGraded / examConfig.students.length) * 100);
            document.getElementById("progressBar").style.width = pct + "%";
            document.getElementById("percentCompleted").innerText = `%${pct} Tamamlandı (${totalGraded}/${examConfig.students.length})`;
        }

        function selectQuestion(idx) {
            currentQuestionIdx = idx;
            inputBuffer = "";
            renderUI();
        }

        function pressNum(num) {
            const student = examConfig.students[currentStudentIdx];
            const maxScore = examConfig.questions[currentQuestionIdx].max;
            
            inputBuffer += num;
            let val = parseInt(inputBuffer);
            if (val > maxScore) { val = maxScore; inputBuffer = String(val); }
            student.scores[currentQuestionIdx] = val;
            saveToStorage();

            if (inputBuffer.length >= 2 || val === maxScore || (maxScore < 10 && inputBuffer.length >= 1)) {
                setTimeout(() => confirmAndNext(), 120);
            } else {
                renderUI();
            }
        }

        function clearScore() {
            inputBuffer = "0";
            const student = examConfig.students[currentStudentIdx];
            student.scores[currentQuestionIdx] = 0;
            saveToStorage();
            renderUI();
            inputBuffer = "";
        }

        function confirmAndNext() {
            inputBuffer = "";
            if (currentQuestionIdx < examConfig.questions.length - 1) {
                currentQuestionIdx++;
            } else {
                if (currentStudentIdx < examConfig.students.length - 1) {
                    currentStudentIdx++;
                    currentQuestionIdx = 0;
                } else {
                    alert("🎉 Tebrikler! Tüm sınıfın not girişi tamamlandı.");
                }
            }
            renderUI();
        }

        function prevStudent() {
            if (currentStudentIdx > 0) {
                currentStudentIdx--;
                currentQuestionIdx = 0;
                inputBuffer = "";
                renderUI();
            }
        }

        function nextStudent() {
            if (currentStudentIdx < examConfig.students.length - 1) {
                currentStudentIdx++;
                currentQuestionIdx = 0;
                inputBuffer = "";
                renderUI();
            }
        }

        function handleQuickSearch(query) {
            const q = query.trim().toLowerCase();
            if (!q) return;

            let foundIdx = examConfig.students.findIndex(s => s.no.toLowerCase() === q);
            if (foundIdx === -1) {
                foundIdx = examConfig.students.findIndex(s => s.name.toLowerCase().includes(q) || s.no.includes(q));
            }

            if (foundIdx !== -1) {
                currentStudentIdx = foundIdx;
                currentQuestionIdx = 0;
                inputBuffer = "";
                renderUI();
            }
        }

        function openStudentListModal() {
            document.getElementById("modalSearchInput").value = "";
            renderStudentListModal("");
            document.getElementById("studentListModal").style.display = "flex";
        }

        function closeStudentListModal() {
            document.getElementById("studentListModal").style.display = "none";
        }

        function renderStudentListModal(filterText) {
            const container = document.getElementById("modalStudentListContainer");
            container.innerHTML = "";
            const q = filterText.trim().toLowerCase();

            examConfig.students.forEach((st, idx) => {
                if (q && !st.name.toLowerCase().includes(q) && !st.no.includes(q)) return;

                const graded = isStudentGraded(st);
                const total = st.scores.reduce((a, b) => a + b, 0);

                const item = document.createElement("div");
                item.className = `student-item ${graded ? 'graded' : ''}`;
                item.onclick = () => {
                    currentStudentIdx = idx;
                    currentQuestionIdx = 0;
                    inputBuffer = "";
                    renderUI();
                    closeStudentListModal();
                };

                item.innerHTML = `
                    <div>
                        <div class="st-no">No: ${st.no}</div>
                        <div class="st-name">${st.name}</div>
                    </div>
                    <div class="st-badge">${graded ? '✔ ' + total + ' Puan' : '⏳ Girilmedi'}</div>
                `;

                container.appendChild(item);
            });
        }

        // 🔴 BULUTA GÖNDERME KÖPRÜSÜ
        async function syncDirectToCloud() {
            const btn = document.querySelector(".btn-sync");
            btn.innerText = "Aktarılıyor... ⏳";
            btn.disabled = true;

            const cloudTopic = "arslanoglu_sync_" + currentActiveUser;
            const bulutPaketi = {
                topic: cloudTopic,
                message: JSON.stringify(examConfig),
                title: "Not Paketi"
            };

            try {
                const response = await fetch("https://ntfy.sh", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(bulutPaketi)
                });

                if (response.ok) {
                    alert(`🎉 BULUTA AKTARILDI!\n\n📚 Ders: ${currentCourse}\n🏫 Şube: ${currentBranch}\n\nNotlar güvenle buluta iletildi. Bilgisayarınızdan tek tıkla çekebilirsiniz.`);
                } else {
                    throw new Error();
                }
            } catch(e) {
                alert("Bağlantı hatası! Lütfen internetinizi kontrol ediniz.");
            } finally {
                btn.innerText = "☁️ Bulut";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
